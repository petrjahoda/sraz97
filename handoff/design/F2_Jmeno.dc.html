<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Sraz po 30 rokách · kdo seš?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E3A8A}a:hover{color:#B02E24}
</style>
</helmet>
<div style="position: relative; min-height: 100vh; box-sizing: border-box; background-color: #FBFCFE; background-image: linear-gradient(#E3EBF5 1px, transparent 1px), linear-gradient(90deg, #E3EBF5 1px, transparent 1px); background-size: 24px 24px; color: #22304D; font-family: Kalam, 'Segoe Print', 'Comic Sans MS', cursive; font-size: 17px; line-height: 1.45; overflow: hidden; display: flex; justify-content: center; padding: 48px 24px 56px 72px">
  <div aria-hidden="true" style="position: absolute; left: 40px; top: 0; bottom: 0; width: 2px; background: #EFA8A8"></div>
  <main style="position: relative; width: 100%; max-width: 780px; display: flex; flex-direction: column; gap: 22px">
    <ol aria-label="Postup" style="list-style: none; margin: 0; padding: 0; display: flex; gap: 8px 18px; flex-wrap: wrap; font-size: 15px; color: #4A5878">
      <li style="display: flex; align-items: center; gap: 6px"><span style="width: 24px; height: 24px; border-radius: 999px; background: #1F7A45; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M3 8.5l3.2 3.2 6.8-7.5" style="fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"></path></svg></span>přihlášení</li>
      <li style="display: flex; align-items: center; gap: 6px; color: #1E3A8A; font-weight: 700"><span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 999px; border: 2px solid #1E3A8A; display: flex; align-items: center; justify-content: center; font-size: 13px">2</span>kdo seš</li>
      <li style="display: flex; align-items: center; gap: 6px"><span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 999px; border: 2px solid #C6D1E0; display: flex; align-items: center; justify-content: center; font-size: 13px">3</span>naklikat dny</li>
    </ol>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: Caveat, cursive; font-weight: 700; font-size: 68px; line-height: 1; color: #1E3A8A">Ahoj! Kdo seš?</h1>
      <p style="margin: 0; font-size: 19px; color: #3B4A6B">Ať víme, kdo co naklikal. Jméno uvidí enem děcka z naší třídy.</p>
    </div>

    <form style="box-sizing: border-box; background: #FFFEF7; border: 1px solid #D5DEEA; box-shadow: 0 14px 30px rgba(34, 48, 77, 0.10); padding: 26px 28px 24px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="jmeno" style="font-size: 16px; font-weight: 700">Jméno a příjmení</label>
        <input id="jmeno" type="text" autocomplete="name" value="{{name}}" onChange="{{onName}}" placeholder="třeba Martina Nováková" style="min-height: 50px; box-sizing: border-box; padding: 0 14px; border: 2px solid #C6D1E0; border-radius: 12px; background: #FFFFFF; color: #22304D; font-family: Kalam, cursive; font-size: 19px">
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="svobodna" style="font-size: 16px; font-weight: 700">Příjmení za svobodna <span style="font-weight: 400; color: #4A5878">(nepovinné)</span></label>
        <input id="svobodna" type="text" value="{{maiden}}" onChange="{{onMaiden}}" placeholder="když se ti změnilo, ať tě poznáme" style="min-height: 50px; box-sizing: border-box; padding: 0 14px; border: 2px solid #C6D1E0; border-radius: 12px; background: #FFFFFF; color: #22304D; font-family: Kalam, cursive; font-size: 19px">
      </div>
      <fieldset style="border: 0; padding: 0; margin: 0; min-width: 0">
        <legend style="padding: 0; margin-bottom: 8px; font-size: 16px; font-weight: 700">Jak o tobě máme psát?</legend>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(250px, 100%), 1fr)); gap: 12px">
          <label style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 10px 16px; box-sizing: border-box; border: 2px solid {{fBd}}; background: {{fBg}}; border-radius: 16px 12px 18px 12px; cursor: pointer">
            <input type="radio" name="rod" checked="{{isF}}" onChange="{{pickF}}" style="width: 22px; height: 22px; margin: 0; accent-color: #1E3A8A">
            <span style="display: flex; flex-direction: column"><span style="font-size: 18px; font-weight: 700">{{first}} naklikala</span><span style="font-size: 14px; color: #4A5878">jsem ženská</span></span>
          </label>
          <label style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 10px 16px; box-sizing: border-box; border: 2px solid {{mBd}}; background: {{mBg}}; border-radius: 16px 12px 18px 12px; cursor: pointer">
            <input type="radio" name="rod" checked="{{isM}}" onChange="{{pickM}}" style="width: 22px; height: 22px; margin: 0; accent-color: #1E3A8A">
            <span style="display: flex; flex-direction: column"><span style="font-size: 18px; font-weight: 700">{{first}} naklikal</span><span style="font-size: 14px; color: #4A5878">jsem chlap</span></span>
          </label>
        </div>
      </fieldset>

      <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 16px 14px; background: #FFF2A6; transform: rotate(-0.5deg); box-shadow: 0 8px 16px rgba(34, 48, 77, 0.12)">
        <span style="font-size: 14px; color: #5B4A00">V třídní knize to pak bude vypadat takto:</span>
        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
          <span style="font-family: Caveat, cursive; font-weight: 700; font-size: 28px; line-height: 1; color: #1E3A8A">{{display}}</span>
          <span style="font-size: 16px">{{verb}} So 19. 6.</span>
          <span style="font-size: 13px; font-weight: 700; padding: 0 9px; border-radius: 999px; border: 2px solid #1F7A45; color: #17703C">Hodí se mi</span>
        </div>
      </div>

      <a href="F3_Hlavni.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border-radius: 16px 12px 18px 12px; background: #1E3A8A; color: #FFFFFF; font-family: Kalam, cursive; font-size: 19px; font-weight: 700; text-decoration: none">Hotovo, jdem na to<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"></path></svg></a>
      <span style="font-size: 14px; color: #4A5878; text-align: center">Jméno můžeš kdykoli změnit, nic se neztratí.</span>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var s = this.state || {};
    var name = s.name != null ? s.name : 'Martina Nováková';
    var maiden = s.maiden != null ? s.maiden : 'Svobodová';
    var rod = s.rod || 'f';
    var first = name.trim().split(/\s+/)[0] || 'Ty';
    var on = { bg: '#E8EEFB', bd: '#1E3A8A' }, off = { bg: '#FFFFFF', bd: '#C6D1E0' };
    var display = (name.trim() || 'Tvoje jméno') + (maiden.trim() ? ', roz. ' + maiden.trim() : '');
    return {
      name: name, maiden: maiden, first: first, display: display,
      verb: rod === 'f' ? 'naklikala' : 'naklikal',
      isF: rod === 'f', isM: rod === 'm',
      fBg: rod === 'f' ? on.bg : off.bg, fBd: rod === 'f' ? on.bd : off.bd,
      mBg: rod === 'm' ? on.bg : off.bg, mBd: rod === 'm' ? on.bd : off.bd,
      onName: function (e) { self.setState({ name: e.target.value }); },
      onMaiden: function (e) { self.setState({ maiden: e.target.value }); },
      pickF: function () { self.setState({ rod: 'f' }); },
      pickM: function () { self.setState({ rod: 'm' }); }
    };
  }
}
</script>
</body>
</html>
